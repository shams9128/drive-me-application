spring.mvc.view.prefix:/WEB-INF/jsp/
spring.mvc.view.suffix:.jsp
#spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
# ===============================
# DATABASE
# ===============================
#
# All three values below can be overridden by environment variables
# (DB_URL / DB_USERNAME / DB_PASSWORD) without touching this file — the part
# after the colon is the default used when that env var isn't set, so local
# development still works exactly as before with no env vars configured.
# In production (e.g. Render), set DB_URL/DB_USERNAME/DB_PASSWORD to your
# hosted MySQL's connection details (e.g. from Aiven).

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carpooling?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Render (and most PaaS hosts) inject the port the app must listen on via a
# PORT env var — this falls back to 8081 for local development.
server.port=${PORT:8081}

# Comma-separated list of origins allowed to call /api/** with credentials
# (see CorsConfig.java). Defaults to the local Vite dev server ports; set
# CORS_ALLOWED_ORIGINS to include your deployed frontend URL(s) in production,
# e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ===============================
# JPA / HIBERNATE
# ===============================

hibernate.dialect:org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql:true
hibernate.hbm2ddl.auto:update
entitymanager.packagesToScan:com
